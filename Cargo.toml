[workspace]
resolver = "2"
members = ["crates/*", "tools/asset-inspector"]

[workspace.package]
version = "0.0.26"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = "=0.30.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "=30.0.1"
winit = { version = "=0.30.12", default-features = false, features = ["rwh_06", "x11"] }
pollster = "0.4"
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extensions", "extras"] }
url = "2"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
cesium-math = { path = "crates/cesium-math" }
cesium-formats = { path = "crates/cesium-formats" }
cesium-tiles = { path = "crates/cesium-tiles" }
cesium-streaming = { path = "crates/cesium-streaming" }
cesium-renderer = { path = "crates/cesium-renderer" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1
