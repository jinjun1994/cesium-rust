<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 960px; height: 540px; overflow: hidden; background: #000; }
  #viewport { position: relative; width: 960px; height: 540px; }
  canvas { width: 960px; height: 540px; display: block; }
  #htmlOverlay { position: absolute; pointer-events: none; }
</style>
</head>
<body>
<div id="viewport">
  <canvas id="canvas"></canvas>
  <img id="htmlOverlay" hidden alt="Cesium" src="/tests/sandcastle/full/Cesium_Logo_overlay.png">
</div>
<script type="module">
import { attachCanvas } from '/bindings/web/sdk.js';

window.testErrors = [];
const canvas = document.getElementById('canvas');
const overlay = document.getElementById('htmlOverlay');

let cleanup = () => {};
let fullRecipes = null;

async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${url}`);
  return res.json();
}

const viewer = await attachCanvas(canvas, {
  terrain: false,
  onError: error => window.testErrors.push(String(error)),
  onRenderError: error => window.testErrors.push(String(error)),
  onPick: result => { window.lastPick = result; },
});
viewer.setImageryTemplate('/assets/NaturalEarthII/{z}/{x}/{reverseY}.jpg', true, 2, 'Natural Earth II');
window.viewer = viewer;

window.waitFrames = (count = 4) => new Promise(resolve => {
  let left = count;
  const step = () => {
    if (--left <= 0) resolve();
    else requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
});

window.runSandcastleCase = async (id) => {
  cleanup();
  cleanup = () => {};
  overlay.hidden = true;
  viewer.resolutionScale = 1;
  viewer.useBrowserRecommendedResolution = false;
  viewer.setImageryTemplate('/assets/NaturalEarthII/{z}/{x}/{reverseY}.jpg', true, 2, 'Natural Earth II');
  viewer.setClock({ startTime: 0, stopTime: 60, currentTime: 0, multiplier: 1, range: 'LOOP_STOP', shouldAnimate: false });

  if (!fullRecipes) {
    fullRecipes = await fetchJson('/tests/sandcastle/full-recipes.json');
  }
  const entry = fullRecipes.cases.find(c => c.id === id);
  if (!entry) throw new Error(`Unknown Sandcastle case: ${id}`);

  const sandcastlePageUrl = new URL('/bindings/web/sandcastle.html', location.href);
  const dataUrl = new URL(entry.path, sandcastlePageUrl).href;
  const data = await fetchJson(dataUrl);

  if (entry.format === 'scene') {
    viewer.clearEntities();
    viewer.useBrowserRecommendedResolution = true;
    if (data.type === 'offline') {
      viewer.setImageryTemplate(new URL(data.template, sandcastlePageUrl).href, true, 2, 'Natural Earth II');
    } else if (data.type === 'html-overlays') {
      overlay.hidden = false;
      const scratch = {};
      cleanup = viewer.scene.preRender.addEventListener(() => {
        const p = viewer.scene.cartesianToCanvasCoordinates(data.overlay.positionCartesian, scratch);
        if (p) {
          overlay.style.left = `${p.x}px`;
          overlay.style.top = `${p.y}px`;
        }
      });
    } else if (data.type === 'resolution-scaling') {
      viewer.resolutionScale = data.resolutionScale;
      viewer.useBrowserRecommendedResolution = data.useBrowserRecommendedResolution;
    }
  } else if (entry.format === 'variants') {
    const idx = data.initial ?? 0;
    const variant = data.variants[idx];
    if (!variant) throw new Error(`Missing initial variant ${idx} for ${id}`);
    await viewer.loadEntities(variant.entities, { baseUrl: dataUrl });
  } else if (entry.format === 'groups') {
    await viewer.loadGroupedEntities(data);
  } else if (entry.format === 'primitives') {
    await viewer.loadPrimitiveInstances(data, { baseUrl: dataUrl });
  } else if (entry.format === 'czml') {
    await viewer.loadCzmlData(data, { baseUrl: dataUrl });
  } else {
    await viewer.loadEntities(data, { baseUrl: dataUrl });
  }

  if (entry.clock) {
    viewer.setClock({ ...entry.clock, shouldAnimate: false });
  } else {
    viewer.setClock({ shouldAnimate: false });
  }

  if (entry.framing === 'viewer-default') {
    viewer.setView({ destinationDegrees: [-100, 40, 17500000], heading: 0, pitch: -Math.PI / 2, roll: 0 });
  } else {
    viewer.zoomToEntities();
  }

  await window.waitFrames(6);
  return {
    id: entry.id,
    format: entry.format,
    framing: entry.framing,
    entityCount: viewer.entities.length,
  };
};
</script>
</body>
</html>
