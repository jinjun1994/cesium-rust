<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 960px; height: 540px; overflow: hidden; background: #000; }
  #viewport { position: relative; width: 960px; height: 540px; }
  canvas { width: 960px; height: 540px; display: block; }
  #htmlOverlay { position: absolute; pointer-events: none; }
</style>
</head>
<body>
<div id="viewport">
  <canvas id="canvas"></canvas>
  <img id="htmlOverlay" hidden alt="Cesium" src="/tests/sandcastle/full/Cesium_Logo_overlay.png">
</div>
<script type="module">
import { attachCanvas } from '/bindings/web/sdk.js';

const DEFAULT_ION_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJmZjQwNzM0Mi02Yjg0LTRlNzMtYTA3My05MDdjNDg5NDI4ZDUiLCJpZCI6MzAxOTAsInNjb3BlcyI6WyJhc3IiLCJnYyJdLCJpYXQiOjE1OTMzMzQ3NTN9.WU9XY55sjONwqLFBdbzTpxBXnQSEQvu0n9s72Mqt8IU';
const params = new URLSearchParams(location.search);
const ionToken = params.has('ionToken') ? params.get('ionToken') : DEFAULT_ION_TOKEN;

window.testErrors = [];
const canvas = document.getElementById('canvas');
const overlay = document.getElementById('htmlOverlay');

let cleanup = () => {};
let fullRecipes = null;
let sceneOverrides = null;
let worldImageryActive = false;

async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}: ${url}`);
  return res.json();
}

const viewer = await attachCanvas(canvas, {
  terrain: false,
  onError: error => {
    const msg = String(error);
    if (/^Imagery .+: request\/decode failed$/.test(msg)) console.warn(msg);
    else window.testErrors.push(msg);
  },
  onRenderError: error => window.testErrors.push(String(error)),
  onPick: result => { window.lastPick = result; },
});
window.viewer = viewer;

async function ensureWorldImagery() {
  if (!ionToken) {
    viewer.setImageryTemplate('/assets/NaturalEarthII/{z}/{x}/{reverseY}.jpg', true, 2, 'Natural Earth II');
    worldImageryActive = false;
    return;
  }
  if (!worldImageryActive) {
    try {
      await viewer.loadWorldImagery(ionToken);
      worldImageryActive = true;
    } catch {
      viewer.setImageryTemplate('/assets/NaturalEarthII/{z}/{x}/{reverseY}.jpg', true, 2, 'Natural Earth II');
      worldImageryActive = false;
    }
  }
}

await ensureWorldImagery();

window.waitFrames = (count = 4) => new Promise(resolve => {
  let left = count;
  const step = () => {
    if (--left <= 0) resolve();
    else requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
});

window.waitSettled = async (maxWaitMs = 8000) => {
  const start = performance.now();
  await window.waitFrames(4);
  while (performance.now() - start < maxWaitMs) {
    const d = viewer.diagnostics;
    if (d.imageryPending === 0 && d.tilePending === 0 && d.terrainPending === 0) {
      await window.waitFrames(3);
      const d2 = viewer.diagnostics;
      if (d2.imageryPending === 0 && d2.tilePending === 0 && d2.terrainPending === 0) break;
    }
    await new Promise(r => setTimeout(r, 80));
  }
};

window.runSandcastleCase = async (id) => {
  cleanup();
  cleanup = () => {};
  overlay.hidden = true;
  viewer.clearEntities();
  viewer.clearTileset();
  viewer.clearGeoJson();
  viewer.clearTerrain();
  viewer.resolutionScale = 1;
  viewer.useBrowserRecommendedResolution = false;
  viewer.setClock({ startTime: 0, stopTime: 60, currentTime: 0, multiplier: 1, range: 'LOOP_STOP', shouldAnimate: false });

  if (!fullRecipes) {
    fullRecipes = await fetchJson('/tests/sandcastle/full-recipes.json');
  }
  if (!sceneOverrides) {
    try {
      sceneOverrides = await fetchJson('/tests/e2e/sandcastle-scenes.json');
    } catch (_) {
      sceneOverrides = {};
    }
  }
  const entry = fullRecipes.cases.find(c => c.id === id);
  if (!entry) throw new Error(`Unknown Sandcastle case: ${id}`);

  const override = sceneOverrides[id] || null;
  if (override && override.imagery) {
    const im = override.imagery;
    viewer.setImageryTemplate(im.template, im.geographic !== false, im.maxLevel ?? 2, im.credit || 'Configured imagery');
    worldImageryActive = false;
  } else if (id === 'offline' || id === 'natural-earth-ii') {
    viewer.setImageryTemplate('/assets/NaturalEarthII/{z}/{x}/{reverseY}.jpg', true, 2, 'Natural Earth II');
    worldImageryActive = false;
  } else {
    await ensureWorldImagery();
  }

  const sandcastlePageUrl = new URL('/bindings/web/sandcastle.html', location.href);
  const dataUrl = new URL(entry.path, sandcastlePageUrl).href;

  if (override) {
    if (override.terrain) {
      await viewer.loadWorldTerrain(ionToken);
    }
    if (override.tileset) {
      if (override.tileset.ionAssetId) {
        try {
          await viewer.loadIonTileset(override.tileset.ionAssetId, ionToken);
        } catch (err) {
          if (/missing endpoint URL|HTTP (401|403|404)/i.test(err?.message || '')) console.warn(err.message);
          else throw err;
        }
      } else if (override.tileset.url) {
        await viewer.load(override.tileset.url);
      }
    }
    let geoId = null;
    if (override.geojson) {
      geoId = await viewer.loadGeoJson(override.geojson.url, override.geojson.style || {});
    }
    if (override.czml) {
      await viewer.loadCzml(override.czml.url);
    }
    if (override.entities) {
      await viewer.loadEntities(override.entities, { baseUrl: location.href });
    }
    if (override.clock) {
      viewer.setClock({ ...override.clock, shouldAnimate: false });
    }
    if (override.camera) {
      if (override.camera.setView) {
        viewer.setView(override.camera.setView);
      } else if (override.camera.lookAt) {
        viewer.lookAt(override.camera.lookAt.targetDegrees, override.camera.lookAt.offset || {});
      } else if (override.camera === 'zoomToEntities') {
        viewer.zoomToEntities();
      }
    } else if (override.entities && override.entities.length > 0) {
      viewer.zoomToEntities();
    } else if (geoId) {
      viewer.focusGeoJson(geoId);
    }
    await window.waitSettled(10000);
    return {
      id: entry.id,
      format: entry.format,
      framing: override.camera ? 'override' : entry.framing,
      entityCount: viewer.entities.length,
    };
  }

  const data = await fetchJson(dataUrl);

  if (entry.format === 'scene') {
    viewer.clearEntities();
    viewer.useBrowserRecommendedResolution = true;
    if (data.type === 'offline') {
      viewer.setImageryTemplate(new URL(data.template, sandcastlePageUrl).href, true, 2, 'Natural Earth II');
      worldImageryActive = false;
    } else if (data.type === 'html-overlays') {
      overlay.hidden = false;
      const scratch = {};
      cleanup = viewer.scene.preRender.addEventListener(() => {
        const p = viewer.scene.cartesianToCanvasCoordinates(data.overlay.positionCartesian, scratch);
        if (p) {
          overlay.style.left = `${p.x}px`;
          overlay.style.top = `${p.y}px`;
        }
      });
    } else if (data.type === 'resolution-scaling') {
      viewer.resolutionScale = data.resolutionScale;
      viewer.useBrowserRecommendedResolution = data.useBrowserRecommendedResolution;
    }
  } else if (entry.format === 'variants') {
    const idx = data.initial ?? 0;
    const variant = data.variants[idx];
    if (!variant) throw new Error(`Missing initial variant ${idx} for ${id}`);
    await viewer.loadEntities(variant.entities, { baseUrl: dataUrl });
  } else if (entry.format === 'groups') {
    await viewer.loadGroupedEntities(data);
  } else if (entry.format === 'primitives') {
    await viewer.loadPrimitiveInstances(data, { baseUrl: dataUrl });
  } else if (entry.format === 'czml') {
    await viewer.loadCzmlData(data, { baseUrl: dataUrl });
  } else {
    await viewer.loadEntities(data, { baseUrl: dataUrl });
  }

  if (entry.clock) {
    viewer.setClock({ ...entry.clock, shouldAnimate: false });
  } else {
    viewer.setClock({ shouldAnimate: false });
  }

  if (entry.framing === 'viewer-default') {
    viewer.setView({ destinationDegrees: [-82.5, 35, 25000000], heading: 0, pitch: -Math.PI / 2, roll: 0 });
  } else {
    viewer.zoomToEntities();
  }

  await window.waitSettled(8000);
  return {
    id: entry.id,
    format: entry.format,
    framing: entry.framing,
    entityCount: viewer.entities.length,
  };
};
</script>
</body>
</html>
